name: FS Support Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mac-intel:
        description: "Construire aussi macOS Intel (sinon : seulement la nuit du dimanche)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Version unique par build : <majeur>.<mineur>.<numéro de run> (ex. 1.0.104).
  # Majeur et mineur viennent de FS_SUPPORT_BASE_VERSION (1.0 par défaut) ; le numéro de run
  # augmente à chaque exécution, ce qui rend la mise à jour automatique des clients possible.
  # Le format reste x.y.z pour get_version_number (Rust) et les versions Windows/Android.
  prepare-fs-support-version:
    name: Prepare FS Support version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mac-intel: ${{ steps.mac-intel.outputs.build }}
    env:
      FS_SUPPORT_BASE_VERSION: ${{ vars.FS_SUPPORT_BASE_VERSION || '1.0.0' }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="${FS_SUPPORT_BASE_VERSION:-1.0.0}"
          MAJOR="$(printf '%s' "$BASE" | cut -d. -f1 | tr -cd '0-9')"
          MINOR="$(printf '%s' "$BASE" | cut -s -d. -f2 | tr -cd '0-9')"
          VERSION="${MAJOR:-1}.${MINOR:-0}.${RUN_NUMBER}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version FS Support invalide : $VERSION" >&2
            exit 1
          fi
          echo "FS Support version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # macOS Intel = le build le plus long (~45 min) pour un parc qui disparaît : une fois par
      # semaine (nuit du dimanche, UTC) ou à la demande. Les autres nuits, la release garde le
      # dernier .dmg Intel publié (voir « Normalize »), sous son propre numéro de version.
      - name: Decide macOS Intel build
        id: mac-intel
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.mac-intel }}
        run: |
          BUILD=false
          if [[ "$ASKED" == "true" ]]; then BUILD=true; fi
          if [[ "$EVENT" == "schedule" && "$(date -u +%u)" == "7" ]]; then BUILD=true; fi
          echo "macOS Intel : $BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  run-fs-support-build:
    needs: prepare-fs-support-version
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "fs-nightly"
      build-scope: "fs-support"
      fs-version: ${{ needs.prepare-fs-support-version.outputs.version }}
      macos-x64: ${{ needs.prepare-fs-support-version.outputs.mac-intel == 'true' }}

  normalize-fs-support-release:
    name: Normalize FS Support release assets
    needs: [prepare-fs-support-version, run-fs-support-build]
    # Publier les plateformes réussies même si une autre (ex. AppImage Linux) a échoué.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: fs-nightly
      FS_SUPPORT_VERSION: ${{ needs.prepare-fs-support-version.outputs.version }}
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Normalize release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${FS_SUPPORT_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            echo "Version FS Support absente (job prepare-fs-support-version)." >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "Normalizing FS Support release assets as version ${VERSION} from build ${SHORT_SHA}"
          WORK_DIR="$(mktemp -d)"
          RAW_DIR="$WORK_DIR/raw"
          OUT_DIR="$WORK_DIR/out"
          mkdir -p "$RAW_DIR" "$OUT_DIR"

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RAW_DIR" --clobber || true

          copy_first() {
            local destination="$1"
            shift
            local match=""
            for pattern in "$@"; do
              match="$(find "$RAW_DIR" -maxdepth 1 -type f -iname "$pattern" | sort | head -n 1)"
              if [[ -n "$match" ]]; then
                cp "$match" "$OUT_DIR/$destination"
                return 0
              fi
            done
            echo "Asset not found for $destination" >&2
            return 0
          }

          # Uniquement les fichiers bruts de CE build (rustdesk-<version>-…) : un ancien
          # fs-support-<version précédente>-… ne doit jamais être republié sous le nouveau numéro,
          # sinon les clients verraient une « mise à jour » qui réinstalle l'ancienne version.
          copy_first "fs-support-${VERSION}-windows-x86_64.exe" "rustdesk-${VERSION}-*x86_64.exe"
          copy_first "fs-support-${VERSION}-windows-x86_64.msi" "rustdesk-${VERSION}-*x86_64.msi"
          copy_first "fs-support-${VERSION}-macos-x86_64.dmg" "rustdesk-${VERSION}-*x86_64*.dmg"
          copy_first "fs-support-${VERSION}-macos-aarch64.dmg" "rustdesk-${VERSION}-*aarch64*.dmg"
          # Linux n'est plus distribué (06/10/2026) : ni .deb ni AppImage (l'ancienne AppImage était republiée sous le nouveau nom).
          copy_first "fs-support-${VERSION}-android-universal.apk" "rustdesk-${VERSION}-*universal*.apk"

          tar --exclude-vcs --exclude="$WORK_DIR" -czf "$OUT_DIR/fs-support-${VERSION}-source.tar.gz" .

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          # macOS Intel n'est construit qu'une nuit par semaine : sans nouveau .dmg Intel, on garde
          # le dernier publié (fs-support-<sa version>-macos-x86_64.dmg). Le site lit la version
          # dans le nom : pas de fausse mise à jour pour les Mac Intel.
          KEEP_PATTERN='^$'
          if [[ ! -f "$OUT_DIR/fs-support-${VERSION}-macos-x86_64.dmg" ]]; then
            KEEP_PATTERN='^fs-support-[0-9.]+-macos-x86_64[.]dmg$'
            echo "Pas de macOS Intel dans ce build : le dernier .dmg Intel publié est conservé."
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq ".[] | select(.name | test(\"^(rustdesk-|fs-support-)\")) | select(.name | test(\"$KEEP_PATTERN\") | not) | .id" | while read -r asset_id; do
            [[ -n "$asset_id" ]] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

          if find "$OUT_DIR" -maxdepth 1 -type f | grep -q .; then
            gh release upload "$RELEASE_TAG" "$OUT_DIR"/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "No normalized asset generated." >&2
            exit 1
          fi
